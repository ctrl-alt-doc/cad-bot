# Merges bot updates that are marked as compatible (minor and patch versions),
# so fixes and new features deploy without any action from you.
# Major versions may need changes on your side, so they wait for you to merge.
# Delete this file to review every update yourself.
name: Auto-merge bot updates

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v2

      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge "$PR_URL" --squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
